name: Temporary mail recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ secrets.DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Inspect Stalwart deployment without changing it
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=5
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
          )
          ssh "${ssh_opts[@]}" "ubuntu@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          stalwart=$(docker ps -a --filter name=stalwart --format '{{.Names}}' | head -n1)
          test -n "$stalwart"
          echo "CONTAINER=$stalwart"
          docker inspect "$stalwart" --format 'IMAGE={{.Config.Image}}'
          docker inspect "$stalwart" --format 'ENTRYPOINT={{json .Config.Entrypoint}} CMD={{json .Config.Cmd}}'
          docker inspect "$stalwart" --format 'COMPOSE_PROJECT={{index .Config.Labels "com.docker.compose.project"}}'
          docker inspect "$stalwart" --format 'COMPOSE_FILES={{index .Config.Labels "com.docker.compose.project.config_files"}}'
          docker inspect "$stalwart" --format 'WORKDIR={{index .Config.Labels "com.docker.compose.project.working_dir"}}'
          docker inspect "$stalwart" --format '{{range .Mounts}}MOUNT type={{.Type}} src={{.Source}} dst={{.Destination}} rw={{.RW}}{{println}}{{end}}'
          docker inspect "$stalwart" --format '{{range $name, $net := .NetworkSettings.Networks}}NETWORK {{$name}} ip={{$net.IPAddress}} gateway={{$net.Gateway}}{{println}}{{end}}'
          docker inspect "$stalwart" --format '{{range .Config.Env}}{{println .}}{{end}}' | sed 's/=.*$/=<redacted>/'
          docker exec "$stalwart" sh -lc '
            command -v stalwart || true
            command -v stalwart-cli || true
            find /opt /etc -maxdepth 4 -type f \( -name "config.json" -o -name "*.toml" -o -name "docker-compose.yml" \) 2>/dev/null | head -40
          '
          docker logs --tail 30 "$stalwart" 2>&1 | grep -E 'Blocked IP|Server started|version' || true
          REMOTE
