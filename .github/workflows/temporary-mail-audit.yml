name: Temporary mail end-to-end audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ secrets.DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Audit Stalwart management and local mail flow
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=5
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
          )

          ssh "${ssh_opts[@]}" "ubuntu@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          work=/tmp/tempo-mail-audit
          rm -rf "$work"
          install -d -m 755 "$work"

          original=$(docker ps -a --filter name=stalwart --format '{{.Names}}' | grep -v '^stalwart-audit$' | head -n1)
          test -n "$original"
          image=$(docker inspect "$original" --format '{{.Config.Image}}')
          network=$(docker inspect "$original" --format '{{range $name, $net := .NetworkSettings.Networks}}{{$name}}{{end}}')
          test -n "$network"

          audit=stalwart-audit
          recovery_password=$(openssl rand -hex 32)
          user_a="tempo-audit-a-$(date +%s)"
          user_b="tempo-audit-b-$(date +%s)"
          pass_a=$(openssl rand -base64 24 | tr -d '\n')
          pass_b=$(openssl rand -base64 24 | tr -d '\n')
          restored=false

          start_audit() {
            docker stop "$original" >/dev/null 2>&1 || true
            docker rm -f "$audit" >/dev/null 2>&1 || true
            docker run -d --name "$audit" \
              --network "$network" \
              -e STALWART_RECOVERY_MODE=1 \
              -e "STALWART_RECOVERY_ADMIN=recovery:$recovery_password" \
              -v /opt/stalwart/config:/etc/stalwart \
              -v /opt/stalwart/data:/var/lib/stalwart \
              "$image" --config /etc/stalwart/config.json >/dev/null
            for attempt in $(seq 1 20); do
              if cli describe >/dev/null 2>&1; then return 0; fi
              sleep 2
            done
            docker logs --tail 60 "$audit" >&2
            return 1
          }

          stop_audit_start_original() {
            docker rm -f "$audit" >/dev/null 2>&1 || true
            docker start "$original" >/dev/null
            for attempt in $(seq 1 20); do
              if docker inspect "$original" --format '{{.State.Running}}' 2>/dev/null | grep -q true; then
                if curl --fail --silent --max-time 8 https://mail.darker.one/admin/ >/dev/null 2>&1; then
                  restored=true
                  return 0
                fi
              fi
              sleep 2
            done
            docker logs --tail 60 "$original" >&2
            return 1
          }

          cli() {
            docker run --rm --network "$network" \
              -e STALWART_URL=http://stalwart-audit:8080 \
              -e STALWART_USER=recovery \
              -e STALWART_PASSWORD="$recovery_password" \
              ghcr.io/stalwartlabs/cli:latest "$@"
          }

          delete_test_accounts() {
            for account_name in "$user_a" "$user_b"; do
              ids=$(cli query Account --where "name=$account_name" --fields id,name --json 2>/dev/null \
                | python3 -c 'import json,sys; [print(x["id"]) for line in sys.stdin if line.strip() for x in [json.loads(line)] if isinstance(x,dict) and x.get("id")]' || true)
              if [ -n "$ids" ]; then
                printf '%s\n' "$ids" | docker run --rm -i --network "$network" \
                  -e STALWART_URL=http://stalwart-audit:8080 \
                  -e STALWART_USER=recovery \
                  -e STALWART_PASSWORD="$recovery_password" \
                  ghcr.io/stalwartlabs/cli:latest delete Account --stdin >/dev/null
              fi
            done
          }

          cleanup() {
            set +e
            if docker inspect "$audit" >/dev/null 2>&1; then
              delete_test_accounts
              docker rm -f "$audit" >/dev/null 2>&1
            fi
            if [ "$(docker inspect "$original" --format '{{.State.Running}}' 2>/dev/null)" != true ]; then
              docker start "$original" >/dev/null 2>&1
            fi
          }
          trap cleanup EXIT

          start_audit
          audit_ip=$(docker inspect "$audit" --format '{{range $name, $net := .NetworkSettings.Networks}}{{$net.IPAddress}}{{end}}')
          test -n "$audit_ip"
          curl --fail --silent --show-error --location --compressed -u "recovery:$recovery_password" \
            "http://$audit_ip:8080/api/schema" > "$work/schema.json"
          python3 -m json.tool "$work/schema.json" >/dev/null

          cli query Domain --fields id,name,isEnabled --json > "$work/domains.ndjson"
          domain_id=$(python3 - "$work/domains.ndjson" <<'PY'
          import json, sys
          for line in open(sys.argv[1], encoding='utf-8'):
              item = json.loads(line)
              if item.get('name') == 'darker.one':
                  print(item['id'])
                  break
          PY
          )
          test -n "$domain_id"

          make_user_json() {
            python3 - "$1" "$domain_id" "$2" <<'PY'
          import json, sys
          name, domain_id, password = sys.argv[1:]
          print(json.dumps({
              "name": name,
              "domainId": domain_id,
              "credentials": {"0": {"@type": "Password", "secret": password}},
              "memberGroupIds": {},
              "roles": {"@type": "User"},
              "permissions": {"@type": "Inherit"},
              "quotas": {},
              "aliases": {},
              "encryptionAtRest": {"@type": "Disabled"}
          }, separators=(',', ':')))
          PY
          }

          cli create Account/User --json "$(make_user_json "$user_a" "$pass_a")" >/dev/null
          cli create Account/User --json "$(make_user_json "$user_b" "$pass_b")" >/dev/null
          created_count=$(cli query Account --fields id,name,emailAddress --json 2>/dev/null \
            | python3 -c 'import json,sys; names=set(sys.argv[1:]); print(sum(1 for line in sys.stdin if line.strip() and json.loads(line).get("name") in names))' "$user_a" "$user_b")
          test "$created_count" = 2

          stop_audit_start_original

          original_ip=$(docker inspect "$original" --format '{{range $name, $net := .NetworkSettings.Networks}}{{$net.IPAddress}}{{end}}')
          test -n "$original_ip"

          export MAIL_USER_A="$user_a@darker.one" MAIL_USER_B="$user_b@darker.one"
          export MAIL_PASS_A="$pass_a" MAIL_PASS_B="$pass_b"
          export MAIL_HOST="$original_ip"
          python3 <<'PY'
          import email, imaplib, os, smtplib, ssl, time
          from email.message import EmailMessage

          user_a = os.environ['MAIL_USER_A']
          user_b = os.environ['MAIL_USER_B']
          mail_host = os.environ['MAIL_HOST']
          subject = 'TEMPO local delivery audit'
          marker = 'tempo-mail-audit-ok'
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          msg = EmailMessage()
          msg['From'] = user_a
          msg['To'] = user_b
          msg['Subject'] = subject
          msg.set_content(marker)
          with smtplib.SMTP_SSL(mail_host, 465, context=ctx, timeout=20) as smtp:
              smtp.login(user_a, os.environ['MAIL_PASS_A'])
              smtp.send_message(msg)

          found = False
          for _ in range(20):
              with imaplib.IMAP4_SSL(mail_host, 993, ssl_context=ctx, timeout=20) as imap:
                  imap.login(user_b, os.environ['MAIL_PASS_B'])
                  imap.select('INBOX')
                  status, data = imap.search(None, 'SUBJECT', '"TEMPO local delivery audit"')
                  if status == 'OK' and data and data[0]:
                      for message_id in data[0].split():
                          status, payload = imap.fetch(message_id, '(RFC822)')
                          if status == 'OK' and marker.encode() in payload[0][1]:
                              found = True
                              break
                  if found:
                      break
              time.sleep(1)
          if not found:
              raise SystemExit('SMTP accepted the message but IMAP did not receive it')
          PY

          start_audit
          delete_test_accounts
          stop_audit_start_original

          python3 - "$work/audit.json" <<'PY'
          import json, sys
          json.dump({
              "domain": "darker.one",
              "domainConfigured": True,
              "temporaryUsersCreated": True,
              "smtpSubmission465": "passed",
              "imapRetrieval993": "passed",
              "temporaryUsersRemoved": True,
              "adminEndpoint": "https://mail.darker.one/admin/"
          }, open(sys.argv[1], 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PY
          chown -R ubuntu:ubuntu "$work"
          echo "Management create/delete and SMTP-to-IMAP delivery passed."
          REMOTE

          scp "${ssh_opts[@]}" -r "ubuntu@$DEPLOY_HOST:/tmp/tempo-mail-audit/." artifacts/
          ssh "${ssh_opts[@]}" "ubuntu@$DEPLOY_HOST" 'sudo rm -rf /tmp/tempo-mail-audit'

      - name: Upload safe audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stalwart-mail-audit
          path: artifacts/
          retention-days: 1
