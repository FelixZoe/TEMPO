name: Temporary mail WebUI deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ secrets.DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload Chinese management UI
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
            -o ConnectTimeout=30
            -o ConnectionAttempts=5
            -o ServerAliveInterval=10
            -o ServerAliveCountMax=3
          )
          scp "${ssh_opts[@]}" .github/stalwart-webui-zh-v2.zip "ubuntu@$DEPLOY_HOST:/tmp/stalwart-webui-zh-v2.zip"
          ssh "${ssh_opts[@]}" "ubuntu@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail
          site=/opt/1panel/www/sites/mail.darker.one
          bundle="$site/index/stalwart-webui-zh-v2"
          conf="$site/proxy/root.conf"

          install -d -m 755 "$bundle"
          python3 -m zipfile -e /tmp/stalwart-webui-zh-v2.zip "$bundle"
          test -f "$bundle/admin-index.html"
          test -f "$bundle/account-index.html"

          python3 - "$conf" <<'PY'
          from pathlib import Path
          import re, sys

          path = Path(sys.argv[1])
          source = path.read_text()
          start = '# Custom Chinese Stalwart WebUI assets'
          end = '# End custom Chinese Stalwart WebUI assets'
          block = '''# Custom Chinese Stalwart WebUI assets
          location = /admin/ {
              alias /www/sites/mail.darker.one/index/stalwart-webui-zh-v2/admin-index.html;
              add_header Cache-Control "no-store";
          }
          location = /account/ {
              alias /www/sites/mail.darker.one/index/stalwart-webui-zh-v2/account-index.html;
              add_header Cache-Control "no-store";
          }
          location ^~ /admin/assets/ {
              alias /www/sites/mail.darker.one/index/stalwart-webui-zh-v2/assets/;
              add_header Cache-Control "public, max-age=31536000, immutable";
          }
          location ^~ /account/assets/ {
              alias /www/sites/mail.darker.one/index/stalwart-webui-zh-v2/assets/;
              add_header Cache-Control "public, max-age=31536000, immutable";
          }
          location = /admin/favicon.ico {
              alias /www/sites/mail.darker.one/index/stalwart-webui-zh-v2/favicon.ico;
          }
          location = /account/favicon.ico {
              alias /www/sites/mail.darker.one/index/stalwart-webui-zh-v2/favicon.ico;
          }
          # End custom Chinese Stalwart WebUI assets
          '''
          pattern = re.compile(re.escape(start) + r'.*?' + re.escape(end) + r'\n?', re.S)
          if pattern.search(source):
              source = pattern.sub(block, source, count=1)
          else:
              # Replace the older unbounded block when present.
              source = re.sub(
                  re.escape(start) + r'.*?(?=location \^~ / \{)',
                  block,
                  source,
                  count=1,
                  flags=re.S,
              )
              if start not in source:
                  needle = 'location ^~ / {'
                  if needle not in source:
                      raise SystemExit('mail reverse-proxy location not found')
                  source = source.replace(needle, block + needle, 1)
          path.write_text(source)
          PY

          openresty=$(docker ps --filter name=openresty --format '{{.Names}}' | head -n1)
          test -n "$openresty"
          docker exec "$openresty" nginx -t
          docker exec "$openresty" nginx -s reload

          html=$(curl --fail --silent --show-error --max-time 10 https://mail.darker.one/admin/)
          printf '%s' "$html" | grep -q 'lang="zh-CN"'
          printf '%s' "$html" | grep -q 'index-MFH8N96-.js'
          curl --fail --silent --show-error --max-time 10 \
            https://mail.darker.one/admin/assets/index-MFH8N96-.js \
            | grep -q '管理用户账户'
          rm -f /tmp/stalwart-webui-zh-v2.zip
          echo 'Chinese management UI deployed and verified.'
          REMOTE
