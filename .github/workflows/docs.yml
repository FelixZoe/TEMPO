name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install dependencies
        working-directory: docs
        run: npm ci
      - name: Build VitePress documentation
        working-directory: docs
        run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: tempo-vitepress-docs
          path: docs/.vitepress/dist
          if-no-files-found: error

  deploy:
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: tempo-vitepress-docs
          path: site
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY_BASE64: ${{ secrets.DEPLOY_SSH_KEY_BASE64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY_BASE64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
      - name: Publish documentation atomically
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          release_name="docs-${GITHUB_SHA::12}"
          deploy_root="/opt/1panel/www/sites/todo.darker.one/docs-live"
          release="$deploy_root/releases/$release_name"
          target="ubuntu@$DEPLOY_HOST"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o BatchMode=yes
          )
          ssh "${ssh_opts[@]}" "$target" "mkdir -p '$release'"
          tar -C site -czf - . | ssh "${ssh_opts[@]}" "$target" "tar -xzf - -C '$release'"
          ssh "${ssh_opts[@]}" "$target" "cd '$deploy_root' && ln -sfn 'releases/$release_name' current-next && mv -Tf current-next current"
          local_sha="$(sha256sum site/index.html | awk '{print $1}')"
          remote_sha="$(ssh "${ssh_opts[@]}" "$target" "sha256sum '$deploy_root/current/index.html' | awk '{print \$1}'")"
          test "$local_sha" = "$remote_sha"
      - name: Verify public documentation
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            if curl --fail --silent --show-error \
              --header 'Cache-Control: no-cache' \
              "https://todo.darker.one/?revision=${GITHUB_SHA}" | grep -q '<title>TEMPO'; then
              exit 0
            fi
            sleep 5
          done
          echo 'The public site did not expose the deployed TEMPO build.' >&2
          exit 1
