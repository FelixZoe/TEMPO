name: iOS OTA Runtime

on:
  push:
    branches: [main]
    paths:
      - "apps/ios-runtime/**"
      - ".github/workflows/ios-ota.yml"
  workflow_dispatch:
    inputs:
      branch:
        description: EAS Update branch
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: tempo-ios-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Resolve native runtime version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ../flutter/pubspec.yaml)"
          test -n "$version"
          echo "TEMPO_APP_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run export:ios

  build-native-runtime:
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios-runtime
    steps:
      - uses: actions/checkout@v7
      - name: Select Xcode with Swift 6.2
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify Apple toolchain
        shell: bash
        run: |
          xcodebuild -version
          xcrun swift --version
          xcrun swift --version | grep -Eq 'Swift version 6\.[2-9]|Swift version [7-9]\.'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - name: Resolve native runtime version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ../flutter/pubspec.yaml)"
          test -n "$version"
          echo "TEMPO_APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate native iOS runtime
        env:
          CI: "1"
        run: npm run prebuild:ios
      - name: Build isolated Swift Package
        run: npm run build:brownfield:ios
      - name: Verify Swift Package
        shell: bash
        run: |
          test -f artifacts/TempoRuntimePackage-release/Package.swift
          find artifacts/TempoRuntimePackage-release -maxdepth 2 -type f | sort
      - uses: actions/upload-artifact@v6
        with:
          name: tempo-ios-runtime-package
          path: apps/ios-runtime/artifacts/TempoRuntimePackage-release
          if-no-files-found: error
          retention-days: 3

  publish-update:
    needs: [validate-runtime, build-native-runtime]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - name: Resolve native runtime version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ../flutter/pubspec.yaml)"
          test -n "$version"
          echo "TEMPO_APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish EAS Update
        if: env.EXPO_TOKEN != ''
        shell: bash
        run: |
          branch="${{ github.event.inputs.branch }}"
          if [[ -z "$branch" ]]; then branch="production"; fi
          npx --yes eas-cli@latest update \
            --branch "$branch" \
            --message "${GITHUB_SHA::12}" \
            --non-interactive
      - name: Explain unpublished validation
        if: env.EXPO_TOKEN == ''
        run: echo "OTA export validated. Add EXPO_TOKEN to publish updates."
